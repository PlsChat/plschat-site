<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PLSChat Tracker</title>
<style>
  :root{
    --bg:#0a0c1f; --panel:#12121f; --panel2:#161a2e; --line:#2a2a3d;
    --txt:#e4e4e7; --txt2:#9ca3af; --txt3:#6b7280;
    --p1:#a855f7; --p2:#c026d3; --p3:#ec4899; --cyan:#67e8f9;
    --me:#7c3aed; --them:#1e2540; --green:#22c55e; --red:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,Roboto,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  /* ---- header ---- */
  header{padding:12px 16px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
  .row{display:flex;align-items:center;gap:10px}
  .title{font-weight:800;font-size:17px;letter-spacing:.2px}
  .grad{background:linear-gradient(90deg,var(--p1),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:0 0 auto;box-shadow:0 0 0 0 rgba(34,197,94,.5)}
  .dot.on{background:var(--green)}
  .meta{margin-left:auto;text-align:right;font-size:11px;color:var(--txt3);line-height:1.3}
  .node{color:var(--cyan);font-family:ui-monospace,Menlo,Consolas,monospace}
  /* ---- tabs ---- */
  nav{display:flex;gap:6px;margin-top:10px}
  .tab{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--txt2);background:transparent}
  .tab.active{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--p1),var(--p3))}
  .tab.locked{opacity:.5}
  .tab.locked::after{content:" 🔒";font-size:10px}
  /* ---- banner ---- */
  .banner{display:none;padding:9px 16px;font-size:12.5px;text-align:center;background:#3a1120;color:#fecaca;border-bottom:1px solid #4c1d2e}
  .banner.show{display:block}
  .banner.info{background:#0f1b33;color:#bfdbfe;border-bottom-color:#1e355e}
  /* ---- messages ---- */
  main{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:8px}
  .empty{margin:auto;text-align:center;color:var(--txt3);font-size:13px;line-height:1.6;max-width:280px}
  .msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap}
  .msg .who{display:block;font-size:10.5px;color:var(--cyan);margin-bottom:2px;font-family:ui-monospace,Menlo,monospace}
  .them{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px}
  .me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
  .sys{align-self:center;font-size:11.5px;color:var(--txt3);background:transparent;padding:2px 8px}
  /* ---- composer ---- */
  footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
  .composer{display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;resize:none;max-height:120px;min-height:44px;padding:11px 14px;border-radius:22px;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:15px;font-family:inherit;outline:none
  }
  textarea:focus{border-color:var(--p1)}
  textarea:disabled{opacity:.5}
  .send{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:50%;color:#fff;font-size:20px;
    background:linear-gradient(135deg,var(--p1),var(--p3))}
  .send:disabled{opacity:.4}
  .hint{margin-top:6px;font-size:10.5px;color:var(--txt3);text-align:center}
</style>
</head>
<body>
  <header>
    <div class="row">
      <span class="dot" id="dot"></span>
      <span class="title"><span class="grad">PLSChat</span> Tracker</span>
      <span class="meta">
        <span id="conn">Disconnected</span><br>
        <span class="node" id="node">node ——</span>
      </span>
    </div>
    <nav>
      <span class="tab active">Public</span>
      <span class="tab locked" onclick="lockedTab('Contacts')">Contacts</span>
      <span class="tab locked" onclick="lockedTab('Rooms')">Rooms</span>
    </nav>
  </header>

  <div class="banner" id="banner"></div>

  <main id="log">
    <div class="empty" id="empty">
      Public-channel messages you send here go out over LoRa to every PLSChat
      device in range — and theirs come back to you.<br><br>
      Say hello 👋
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the public channel…"
        enterkeyhint="send" disabled></textarea>
      <button class="send" id="sendBtn" onclick="send()" disabled>➤</button>
    </div>
    <div class="hint" id="hint">Public channel · encrypted with the shared community key</div>
  </footer>

<script>
(function(){
  "use strict";
  var connected = false;
  var myNode = null;
  var log = document.getElementById("log");
  var empty = document.getElementById("empty");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var dot = document.getElementById("dot");
  var connEl = document.getElementById("conn");
  var nodeEl = document.getElementById("node");
  var banner = document.getElementById("banner");

  function hasBridge(){ return typeof Android !== "undefined" && Android; }

  // ---- rendering ----------------------------------------------------------
  function removeEmpty(){ if(empty){ empty.remove(); empty = null; } }

  function addMsg(kind, who, text){
    removeEmpty();
    var el = document.createElement("div");
    el.className = "msg " + kind;
    if(who){
      var w = document.createElement("span");
      w.className = "who";
      w.textContent = who;
      el.appendChild(w);
    }
    var body = document.createElement("span");
    body.textContent = text;           // textContent = no HTML injection
    el.appendChild(body);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function addSys(text){
    removeEmpty();
    var el = document.createElement("div");
    el.className = "msg sys";
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  // ---- outgoing -----------------------------------------------------------
  function send(){
    var text = input.value.trim();
    if(!text || !connected) return;
    if(hasBridge()) Android.send(text);
    addMsg("me", "Me", text);
    input.value = "";
    input.style.height = "auto";
    input.focus();
  }
  window.send = send;

  input.addEventListener("input", function(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
  // Enter sends; Shift+Enter makes a newline.
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });

  window.lockedTab = function(name){
    setBanner("info", name + " need a firmware update on the tracker before they "
      + "work over Bluetooth. Public chat is live now.");
    setTimeout(clearBanner, 4200);
  };

  // ---- incoming (called from native) -------------------------------------
  function handleLine(line){
    if(!line) return;
    if(line.indexOf("MSG:") === 0){
      // MSG:<8hexId>:<text>  — text may itself contain ':'
      var rest = line.substring(4);
      var sep = rest.indexOf(":");
      if(sep < 0) return;
      var id = rest.substring(0, sep);
      var text = rest.substring(sep + 1);
      addMsg("them", "node " + id, text);
    } else if(line.indexOf("ME:") === 0){
      myNode = line.substring(3).trim();
      nodeEl.textContent = "node " + myNode;
    } else if(line.indexOf("ERR") === 0){
      addSys(line);
    }
    // Unknown line types are ignored so future firmware can add its own
    // without breaking this build.
  }

  function setState(isConnected, name){
    connected = !!isConnected;
    dot.classList.toggle("on", connected);
    connEl.textContent = connected ? (name || "Connected") : "Disconnected";
    input.disabled = !connected;
    sendBtn.disabled = !connected;
    if(connected){
      clearBanner();
      if(!myNode && hasBridge()) Android.who();
    } else {
      setBanner("err", "Tracker disconnected. Tap Reconnect at the top to find it again.");
      nodeEl.textContent = "node ——";
      myNode = null;
    }
  }

  function setBanner(kind, text){
    banner.textContent = text;
    banner.className = "banner show" + (kind === "info" ? " info" : "");
  }
  function clearBanner(){ banner.className = "banner"; }

  // Native bridge entry points.
  window.__ble = { line: handleLine, state: setState };

  // If we were connected before this page finished loading, sync up now.
  if(hasBridge()){
    try{
      if(Android.connected()){ setState(true, null); Android.who(); }
    }catch(e){}
  }
})();
</script>
</body>
</html>
